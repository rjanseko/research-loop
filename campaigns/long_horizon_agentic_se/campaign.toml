id = "long-horizon-agentic-se-2024-2026"
title = "State of the Art in Long-Horizon Agentic Software Engineering, 2024–2026"
status = "planned"
graph_version = "research-graph-v1"
period_start = "2024-01-01"
period_end = "2026-09-23"
as_of = "2026-09-23"

[execution]
normalized_web = true
scholarly_cache_mode = "record"
model_budget_gate = "Do not start paid model runs until research-diagnose --smoke passes and provider spending caps are set."
first_run = "One narrow pilot question, followed by evidence review before the full campaign."
# Running several questions continues past a failed one, but stops after this many failures:
# repeated failures more likely share a cause (credentials, a provider outage, a bug).
max_failed_questions = 2
# Wall-clock limit per question; a question past it is recorded failed (TimeoutError). The pilot's took 20 minutes.
question_timeout_seconds = 3600
max_parallel_scouts = 2
planner_question_min = 1
planner_question_max = 3
max_deep_dives_per_round = 2
# Run deep dives one at a time so each budget check sees the previous one's spend.
max_parallel_deep_dives = 1
max_verification_rounds = 0
deep_dive_cost_limit_usd = 1.25
# Soft cap across all model calls for one question; checked before each call.
question_cost_limit_usd = 5.0
# Part of the cap that scouts, deep dives, and the planner leave for gap analysis,
# synthesis, verification, and salvaging research that ran out of budget.
question_reserve_usd = 2.5
# Scouts are cheap per token. The pilot's scouts stopped on request and tool-call counts
# at 15-25% of their dollar cap, so these limits buy depth; tokens are sized to fit.
scout_max_requests = 16
scout_max_tool_calls = 36
scout_total_tokens_limit = 500_000
research_notes = [
    "Use primary benchmark papers and official repositories for benchmark claims.",
    "Label publication status and include DOI/arXiv/OpenAlex/ACL IDs when available.",
    "Start with scholar_search, setting year_from and year_to to the publication window; widen it only to identify the original versions of benchmarks and methods that later work builds on. Resolve known DOI, arXiv, or OpenAlex IDs with scholar_get.",
    "Use web search for official benchmark repositories, leaderboards, and vendor reports; record vendor-reported results as vendor claims.",
    "Fetch full text only for the few sources central to the answer, and find related work through scholar_citations or scholar_references of seminal papers.",
    "Tool calls and tokens are limited: return the structured result once the core evidence is in hand instead of exhausting the budget.",
]

[source_policy]
tier_a = "Peer-reviewed, accepted conference, or journal work"
tier_b = "High-quality preprints, labeled as preprints"
tier_c = "Official benchmark papers, repositories, and technical reports"
tier_d = "Credible engineering reports and blogs, attributed to their publisher"
tier_e = "General web discussion, for leads rather than central claims"
benchmark_claims = "Prefer benchmark paper, official repository, and official result tables; record version and evaluation conditions."
version_rule = "Keep preprint, submission, accepted, and published records distinct; link versions by verified IDs."

# research-campaign --synthesize: one campaign-level agent job over completed questions.
[synthesis]
cost_limit_usd = 6.0
total_tokens_limit = 600_000
# Initial call plus one citation retry. A third request does not fit total_tokens_limit.
max_requests = 2
# One retry of a max-size prompt is 2 × input + 3 × this cap. At 2.5 characters per
# token, 600_000 characters is 240_000 input tokens, and 36_000 output tokens keeps
# that retry at 588_000, inside total_tokens_limit. --synthesize checks the actual
# prompt against the synthesis route and refuses it before the call if a retry would not fit.
max_output_tokens = 36_000
max_prompt_chars = 600_000

[outputs]
# Written per question under <output>/<question id>/; run.json marks a completed run.
question_files = ["report.md", "report.json", "evidence_ledger.json", "bibliography.json", "verification.json", "run.json"]
# Written by --synthesize under <output>/campaign/ (--aggregate writes only the ledger and bibliography).
campaign_files = ["report.md", "synthesis.json", "evidence_ledger.json", "bibliography.json", "benchmark_catalog.json", "architecture_patterns.json", "failure_modes.json", "open_questions.json", "hypotheses.json"]
findings_sections = ["well_supported", "preliminary", "vendor_claims", "contradictory", "unknowns"]
hypothesis_fields = ["supporting_evidence", "contradicting_evidence", "confidence", "proposed_experiment", "expected_metric", "estimated_cost"]

[[questions]]
id = "q01"
text = "How is long-horizon software-engineering agency defined and measured?"
[[questions]]
id = "q02"
text = "What are the scope, versions, evaluation methods, and limits of SWE-bench variants, Terminal-Bench, DeepSWE, RoadmapBench, LongCLI-Bench, and NL2Repo-style benchmarks?"
[[questions]]
id = "q03"
text = "Which planning and replanning methods have measured effects on long tasks?"
[[questions]]
id = "q04"
text = "How do context compaction, external memory, repository maps, and retrieval affect long tasks?"
[[questions]]
id = "q05"
text = "What evidence supports multi-agent, subagent, planner/coder/reviewer, and parallel-exploration architectures at equal cost?"
[[questions]]
id = "q06"
text = "How do agents use tests, verification, hidden tests, and regression checks?"
[[questions]]
id = "q07"
text = "What causes goal drift, premature stopping, repeated work, architecture degradation, and context loss?"
[[questions]]
id = "q08"
text = "Which strategies recover from failed tests and incorrect intermediate plans?"
[[questions]]
id = "q09"
text = "How do tool interfaces and permission boundaries change agent performance and safety?"
[[questions]]
id = "q10"
text = "What fair, matched-condition evidence compares GPT, Claude, GLM, Grok, and Gemini families on long-horizon coding tasks?"
[[questions]]
id = "q11"
text = "What open questions and falsifiable hypotheses should guide later coding-agent experiments?"
