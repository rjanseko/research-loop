# Screening study, not a model-selection result. See docs/evaluation.md, "Serper, Brave, and
# DeepSeek integration study". Only the scout model changes; planning, synthesis, web search,
# depth, grader, and auditor remain fixed. DeepSeek model IDs require a smoke check before paid runs.
# The same four-provider allowlist applies to every arm because the local allowlist excludes DeepSeek.
#
# Decision rule fixed before paid calls: advance a DeepSeek model to a repeated confirmation only
# if it has no provider/protocol or run-invariant defect, completes at least as many cases as Luna,
# and equals or improves evidence yield or case-specific report quality on at least two of four
# cases. Record its price and latency even if it fails. One replicate cannot select a default.
# The confirmation rule is in docs/evaluation.md.
study = "deepseek-integrations-screen"
kind = "scout"
cases = ["st04-ilsvrc-captioning", "st05-scaling-table", "st07-swebench-trust", "drb2-task8"]
replicates = 1
cap_usd = 3.00
estimate_usd = 0.75   # standard Scout's soft run cap; DeepSeek Pro may reach it sooner
ceiling_usd = 11.00   # 12 x ($0.75 run + $0.06 grade + $0.04 audit) = $10.20, plus room
grade = true
grade_estimate_usd = 0.06
audit = true
audit_model = "zai:glm-5.3@high"
audit_estimate_usd = 0.04

[[arms]]
name = "luna"
args = ["--depth", "standard"]
env = { RESEARCH_SEARCH_ENGINE = "duckduckgo", RESEARCH_MODELS__SCOUT = "openai:gpt-6-luna@high", RESEARCH_MODELS__SCOUT_ALT = "", RESEARCH_ENABLED_PROVIDERS = "openai,anthropic,zai,deepseek" }

[[arms]]
name = "deepseek-flash"
args = ["--depth", "standard"]
env = { RESEARCH_SEARCH_ENGINE = "duckduckgo", RESEARCH_MODELS__SCOUT = "deepseek:deepseek-flash@high", RESEARCH_MODELS__SCOUT_ALT = "", RESEARCH_ENABLED_PROVIDERS = "openai,anthropic,zai,deepseek" }

[[arms]]
name = "deepseek-v4-pro"
args = ["--depth", "standard"]
env = { RESEARCH_SEARCH_ENGINE = "duckduckgo", RESEARCH_MODELS__SCOUT = "deepseek:deepseek-v4-pro@high", RESEARCH_MODELS__SCOUT_ALT = "", RESEARCH_ENABLED_PROVIDERS = "openai,anthropic,zai,deepseek" }
