# Does a deep run's gap follow-up establish the drb2-task8 members that scouts name but do not check
# (ICSD, CSD, ASM, DDSE), and does the rubric score move? Two replicates per arm, graded.
study = "deep-vs-standard-task8"
kind = "scout"
cases = ["drb2-task8"]
replicates = 2
cap_usd = 3.00          # each run's hard cap; Luna's reservations need headroom
estimate_usd = 0.60     # a deep run: planner, up to 8 scouts, gap analysis, 3 deep dives, synthesis
ceiling_usd = 3.00
grade = true
grade_estimate_usd = 0.06

[[arms]]
name = "standard"
args = ["--depth", "standard"]

[[arms]]
name = "deep"
args = ["--depth", "deep"]
