# Is a deep run a large improvement over a standard one on drb2-task8, on the current code
# (scout-v10, scout-followup-v11)? No DeepResearch Bench II case has had a production run since
# scout-v6, when one deep run scored 33 of 52 against a standard run's 27 (56c4b4dd, 10bb8779);
# this study also re-establishes that baseline. Three replicates per arm, graded and audited.
#
# Decision rule, fixed before any paid run (docs/study-log.md, 27 September 2026):
# - Deep is a large improvement only if its mean rubric score is at least 5 points (of 52) above
#   standard's under both judges: gpt-6-sol@high, which the study runs, and zai:glm-5.3@high,
#   regraded afterwards. Their disagreements on the decisive points are checked by hand.
# - Deep must not lose support: its share of "supported" audit verdicts is no more than 5
#   percentage points below standard's, and no deep run fails.
# - Deep must cost no more than $1.00 a run on average.
# If all three hold, the next step is sending broad research questions to deep by default, confirmed
# on a held-out case before adoption. Otherwise the result is recorded as undecided or negative.
# Alongside the rubric, the study reports measures that vary less: scouts that returned on their own,
# coverage items established, verified quotes, time, and cost.
study = "deep-vs-standard-task8"
kind = "scout"
cases = ["drb2-task8"]
replicates = 3
cap_usd = 3.00          # each run's hard cap; synthesis reserves up to about $1.50 before it settles
estimate_usd = 0.60     # the most a comparable run has cost: the Luna@xhigh deep run 2c66e8bd, $0.603
ceiling_usd = 5.00      # six runs at their estimates, grades, and audits come to $4.20; a quarter's headroom
grade = true
grade_estimate_usd = 0.06
audit = true
audit_model = "zai:glm-5.3@high"
audit_estimate_usd = 0.04

[[arms]]
name = "standard"
args = ["--depth", "standard"]

[[arms]]
name = "deep"
args = ["--depth", "deep"]
