# Historical: trimming was removed in scout-v15, so RESEARCH_TRIM_HISTORY no longer does anything and both arms
# would now run the same. Kept as the record of the 28 September 2026 study.
# Does trimming a scout's history (history.py) do more harm than good now that Luna's pacer uses the
# account's real 2,000,000 tokens a minute? Each arm rescouts the same three stored drb2-task8 plans
# (scout-v10, gpt-6-sol@high planner, standard depth) on the current code with Luna@high scouts; only
# RESEARCH_TRIM_HISTORY changes. Claims and research are graded by one judge (diagnose). Run it before
# the DeepSeek rescout study, since DeepSeek's cost depends far more on the cache hit rate than Luna's.
#
# Decision rule, fixed before any paid run. Turn trimming off by default if untrimmed:
# - has no failed or partial rescout, and no scout stopped by a limit, that trimmed did not on the same plan;
# - reads a larger share of scout input from the prompt cache (run_calls usage);
# - costs no more than 25% more in median scout cost;
# - has a verified-quote share no more than 5 points below trimmed's, and mean points claimed no more
#   than 2 below trimmed's.
# If untrimmed fails only on a limit stop, the next step is a larger history limit, not trimming.
# Otherwise trimming stays on. Three plans per arm cannot detect small score changes (about 8 points),
# so this decides on limits, cache, and cost at equal quality, not on quality gains.
study = "trim-history-rescout-task8"
kind = "rescout"
sources = ["aea52be0-2e67-4a9b-8400-ca2b907fe12b", "8f753940-34f6-4a5b-a677-238157672d54",
           "27701a2f-b052-457d-8d59-ed3ada12189f"]
replicates = 1
cap_usd = 1.00          # each rescout's hard cap
estimate_usd = 0.25     # source scouts cost $0.070 to $0.084 (v10); v13's larger windows and no trimming could triple it
ceiling_usd = 3.00      # six rescouts and diagnoses at their estimates come to $2.40
diagnose = true
diagnose_model = "zai:glm-5.3@high"
diagnose_estimate_usd = 0.15
diagnose_cap_usd = 0.75

[[arms]]
name = "trimmed"
args = ["--model", "openai:gpt-6-luna@high"]
env = { RESEARCH_SEARCH_ENGINE = "duckduckgo", RESEARCH_MODELS__SCOUT_ALT = "", RESEARCH_TRIM_HISTORY = "true" }

[[arms]]
name = "untrimmed"
args = ["--model", "openai:gpt-6-luna@high"]
env = { RESEARCH_SEARCH_ENGINE = "duckduckgo", RESEARCH_MODELS__SCOUT_ALT = "", RESEARCH_TRIM_HISTORY = "false" }
