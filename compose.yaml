services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research
      POSTGRES_DB: research_loop
    ports:
      - "5432:5432"
    volumes:
      - research_loop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research_loop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  research_loop_pgdata:
