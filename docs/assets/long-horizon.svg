<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img" aria-labelledby="t d"><title id="t">A long-horizon study</title><desc id="d">A spec lists research questions. Each runs as its own research-graph job and publishes its folder atomically with a run.json of file hashes; a failed question is recorded and skipped. Aggregation merges the completed ledgers and bibliographies, and one synthesis job writes the study report, catalogs, and hypotheses.</desc><style>:root{--bg:#ffffff;--fg:#0f172a;--muted:#64748b;--node:#f8fafc;--edge:#cbd5e1;--frame:#e2e8f0;--c-planner:#4f46e5;--t-planner:#e0e7ff;--c-scout:#0d9488;--t-scout:#ccfbf1;--c-join:#475569;--t-join:#e2e8f0;--c-gap:#7c3aed;--t-gap:#ede9fe;--c-deep:#0284c7;--t-deep:#e0f2fe;--c-synth:#db2777;--t-synth:#fce7f3;--c-verify:#059669;--t-verify:#d1fae5;--c-done:#ca8a04;--t-done:#fef3c7;--c-block:#dc2626;--t-block:#fee2e2;--c-data:#9333ea;--t-data:#f3e8ff}@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--fg:#e6edf3;--muted:#8b949e;--node:#161b22;--edge:#3d444d;--frame:#30363d;--c-planner:#818cf8;--t-planner:#312e81;--c-scout:#2dd4bf;--t-scout:#134e4a;--c-join:#94a3b8;--t-join:#334155;--c-gap:#a78bfa;--t-gap:#4c1d95;--c-deep:#38bdf8;--t-deep:#0c4a6e;--c-synth:#f472b6;--t-synth:#831843;--c-verify:#34d399;--t-verify:#064e3b;--c-done:#facc15;--t-done:#713f12;--c-block:#f87171;--t-block:#7f1d1d;--c-data:#c084fc;--t-data:#581c87}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.muted{fill:var(--muted)}.edge{fill:none;stroke:var(--edge);stroke-width:1.6}.dash{stroke-dasharray:5 4}.arrow{fill:var(--edge)}.node{fill:var(--node);stroke:var(--edge);stroke-width:1.5}.frame{fill:var(--bg);stroke:var(--frame);stroke-width:1}.panel{fill:none;stroke:var(--frame);stroke-width:1.2;stroke-dasharr