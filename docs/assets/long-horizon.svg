14" y="197" font-size="12.5" font-weight="600" text-anchor="middle" class="">q05</text><text x="614" y="212" font-size="9.5" font-weight="400" text-anchor="middle" class="mono muted">graph run</text><g class="k11"><text x="614" y="242" font-size="10.5" font-weight="400" text-anchor="middle" class="mono">✓ run.json</text><rect x="580" y="229" width="68" height="18" rx="4" fill="none" stroke="var(--c-verify)" stroke-width="1.2"/></g><rect class="node k12" x="665.0" y="177.0" width="74" height="46" rx="9"/><text x="702" y="197" font-size="12.5" font-weight="600" text-anchor="middle" class="">q06</text><text x="702" y="212" font-size="9.5" font-weight="400" text-anchor="middle" class="mono muted">graph run</text><g class="k13"><text x="702" y="242" font-size="10.5" font-weight="400" text-anchor="middle" class="mono">✓ run.json</text><rect x="668" y="229" width="68" height="18" rx="4" fill="none" stroke="var(--c-verify)" stroke-width="1.2"/></g><rect class="node k14" x="776.0" y="172.0" width="148" height="56" rx="9"/><text x="850" y="197" font-size="12.5" font-weight="600" text-anchor="middle" class="">Aggregate</text><text x="850" y="212" font-size="9.5" font-weight="400" text-anchor="middle" class="mono muted">ledgers + bibliography</text><rect class="node k15" x="943.0" y="172.0" width="124" height="56" rx="9"/><text x="1005" y="197" font-size="12.5" font-weight="600" text-anchor="middle" class="">Synthesize</text><text x="1005" y="212" font-size="9.5" font-weight="400" text-anchor="middle" class="mono muted">one agent job</text><g class="k16"><rect x="945" y="250" width="120" height="18" rx="4" fill="var(--t-synth)" stroke="var(--c-synth)" stroke-width="1.2"/><text x="1005.0" y="263" font-size="10" font-weight="400" text-anchor="middle" class="mono">report.md</text></g><g class="k17"><rect x="945" y="274" width="120" height="18" rx="4" fill="var(--t-synth)" stroke="var(--c-synth)" stroke-width="1.2"/><text x="1005.0" y="287" font-size="10" font-weight="400" text-anchor="middle" class="mono">catalogs</text></g><g class="k18"><rect x="945" y="298" width="120" height="18" rx="4" fill="var(--t-synth)" stroke="var(--c-synth)" stroke-width="1.2"/><text x="1005.0" y="311" font-size="10" font-weight="400" text-anchor="middle" class="mono">hypotheses</text></g><g class="k19"><text x="550" y="120" font-size="13" font-weight="400" text-anchor="middle" class="">The spec fixes the scope: questions, publication window, source tiers, budgets.</text></g><g class="k20"><text x="550" y="120" font-size="13" font-weight="400" text-anchor="middle" class="">Questions run one job at a time; each publishes its folder in one rename.</text></g><g class="k21"><text x="550" y="120" font-size="13" font-weight="400" text-anchor="middle" class="">A failed question is recorded and the run moves on; max_failed_questions failures stop it.</text></g><g class="k22"><text x="550" y="120" font-size="13" font-weight="400" text-anchor="middle" class="">run.json holds each file&#x27;s hash and the objective hash; edited or stale outputs are left out.</text></g><g class="k23"><text x="550" y="120" font-size="13" font-weight="400" text-anchor="middle" class="">Aggregation merges completed evidence; one synthesis job writes the report, catalogs, hypotheses.</text></g></svg>