{animation:k23 16.0s linear infinite}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0L10 5L0 10z"/></marker></defs><rect class="frame" x="0.5" y="0.5" width="1099" height="379" rx="14"/><text x="28" y="36" font-size="16" font-weight="700" text-anchor="start" class="">Long-horizon study: many research jobs, one synthesis</text><text x="28" y="56" font-size="11.5" font-weight="400" text-anchor="start" class="mono muted">research-long-horizon --all-questions, then --aggregate and --synthesize</text><rect class="node k1" x="24.0" y="165.0" width="144" height="70" rx="9"/><text x="96" y="197" font-size="12.5" font-weight="600" text-anchor="middle" class="">spec.toml</text><text x="96" y="212" font-size="9.5" font-weight="400" text-anchor="middle" class="mono muted">questions, window,</text><text x="96" y="224" font-size="9.5" font-weight="400" text-anchor="middle" class="mono muted">source policy, budgets</text><path class="edge" d="M 168.0 200 C 196.5 200, 196.5 200, 225.0 200" marker-end="url(#a)"/><path class="edge" d="M 299.0 200 C 311.0 200, 301.0 200, 313.0 200" marker-end="url(#a)"/><path class="edge" d="M 387.0 200 C 399.0 200, 389.0 200, 401.0 200" marker-end="url(#a)"/><path class="edge" d="M 475.0 200 C 487.0 200, 477.0 200, 489.0 200" marker-end="url(#a)"/><path class="edge" d="M 563.0 200 C 575.0 200, 565.0 200, 577.0 200" marker-end="url(#a)"/><path class="edge" d="M 651.0 200 C 663.0 200, 653.0 200, 665.0 200" marker-end="url(#a)"/><text x="756" y="196" font-size="18" font-weight="400" text-anchor="middle" class="muted">…</text><path class="edge" d="M 739 200 C 757.5 200, 757.5 200, 776.0 200" marker-end="url(#a)"/><path class="edge" d="M 924.0 200 C 936.0 200, 931.0 200, 943.0 200" marker-end="url(#a)"/><rect class="node k2" x="225.0" y="177.0" width="74" height="46" rx="9"/><text x="262" y="197" font-size="12.5" font-weight="600" text-anchor="middle