:scaleX(1);opacity:1}29.375%{transform:scaleX(1);opacity:0}100.000%{transform:scaleX(1);opacity:0}}.k1{animation:k1 16.0s linear infinite}@keyframes k2{0.000%{transform:translate(74px,138px);opacity:1}2.813%{transform:translate(74px,138px);opacity:1}5.000%{transform:translate(284px,158px);opacity:1}27.500%{transform:translate(284px,158px);opacity:1}30.625%{transform:translate(734px,230px);opacity:1}40.000%{transform:translate(734px,230px);opacity:1}44.375%{transform:translate(914px,138px);opacity:1}97.500%{transform:translate(914px,138px);opacity:1}100.000%{transform:translate(914px,138px);opacity:0}}.k2{animation:k2 16.0s linear infinite}@keyframes k3{0.000%{transform:scaleX(0);opacity:0}5.000%{transform:scaleX(0);opacity:1}15.000%{transform:scaleX(1);opacity:1}16.875%{transform:scaleX(1);opacity:0}100.000%{transform:scaleX(1);opacity:0}}.k3{animation:k3 16.0s linear infinite}@keyframes k4{0.000%{transform:translate(74px,184px);opacity:1}2.813%{transform:translate(74px,184px);opacity:1}5.000%{transform:translate(284px,232px);opacity:1}15.000%{transform:translate(284px,232px);opacity:1}18.125%{transform:translate(734px,138px);opacity:1}41.562%{transform:translate(734px,138px);opacity:1}45.938%{transform:translate(914px,184px);opacity:1}97.500%{transform:translate(914px,184px);opacity:1}100.000%{transform:translate(914px,184px);opacity:0}}.k4{animation:k4 16.0s linear infinite}@keyframes k5{0.000%{transform:scaleX(0);opacity:0}5.000%{transform:scaleX(0);opacity:1}20.000%{transform:scaleX(1);opacity:1}21.875%{transform:scaleX(1);opacity:0}100.000%{transform:scaleX(1);opacity:0}}.k5{animation:k5 16.0s linear infinite}@keyframes k6{0.000%{transform:translate(74px,230px);opacity:1}2.813%{transform:translate(74px,230px);opacity:1}5.000%{transform:translate(284px,306px);opacity:1}20.000%{transform:translate(284px,306px);opacity:1}23.125%{transform:translate(734px,184px);opacity:1}43.125%{transform:translate(734px,184px);opacity:1}47.500%{transform:translate(914px,230px);opacity:1}97.500%{transform:translate(914px,230px);opacity:1}100.000%{transform:translate(914px,230px);opacity:0}}.k6{animation:k6 16.0s linear infinite}@keyframes k7{0.000%{transform:scaleX(0);opacity:0}16.250%{transform:scaleX(0);opacity:1}33.750%{transform:scaleX(1);opacity:1}35.625%{transform:scaleX(1);opacity:0}100.000%{transform:scaleX(1);opacity:0}}.k7{animation:k7 16.0s linear infinite}@keyframes k8{0.000%{transform:translate(74px,276px);opacity:1}14.062%{transform:translate(74px,276px);opacity:1}16.250%{transform:translate(284px,232px);opacity:1}33.750%{transform:translate(284px,232px);opacity:1}36.875%{transform:translate(734px,322px);opacity:1}44.688%{transform:translate(734px,322px);opacity:1}49.062%{transform:translate(914px,276px);opacity:1}97.500%{transform:translate(914px,276px);opacity:1}100.000%{transform:translate(914px,276px);opacity:0}}.k8{animation:k8 16.0s linear infinite}@keyframes k9{0.000%{transform:scaleX(0);opacity:0}21.250%{transform:scaleX(0);opacity:1}30.000%{transform:scaleX(1);opacity:1}31.875%{transform:scaleX(1);opacity:0}100.000%{transform:scaleX(1);opacity:0}}.k9{animation:k9 16.0s linear infinite}@keyframes k10{0.000%{transform:translate(74px,322px);opacity:1}19.062%{transform:translate(74px,322px);opacity:1}21.250%{transform:translate(284px,306px);opacity:1}30.000%{transform:translate(284px,306px);opacity:1}33.125%{transform:translate(734px,276px);opacity:1}46.250%{transform:translate(734px,276px);opacity:1}50.625%{transform:translate(914px,322px);opacity:1}97.500%{transform:translate(914px,322px);opacity:1}100.000%{transform:translate(914px,322px);opacity:0}}.k10{animation:k10 16.0s linear infinite}@keyframes k11{0.000%{opacity:0}0.000%{opacity:0}0.000%{opacity:1}16.250%{opacity:1}17.812%{opacity:0}100.000%{opacity:0}}.k11{animation:k11 16.0s linear infinite}@keyframes k12{0.000%{opacity:0}14.688%{opacity:0}16.250%{opacity:1}36.875%{opacity:1}38.438%{opacity:0}100.000%{opacity:0}}.k12{animation:k12 16.0s linear infinite}@keyframes k13{0.000%{opacity:0}35.312%{opacity:0}36.875%{opacity:1}40.625%{opacity:1}42.188%{opacity:0}100.000%{opacity:0}}.k13{animation:k13 16.0s linear infinite}@keyframes k14{0.000%{opacity:0}39.062%{opacity:0}40.625%{opacity:1}100.000%{opacity:0}100.000%{opacity:1}100.000%{opacity:0}}.k14{animation:k14 16.0s linear infinite}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0L10 5L0 10z"/></marker></defs><rect class="frame" x="0.5" y="0.5" width="1059" height="419" rx="14"/><text x="28" y="36" font-size="16" font-weight="700" text-anchor="start" class="">Fan-out → join → record</text><text x="28" y="56" font-size="11.5" font-weight="400" text-anchor="start" class="muted">max_parallel_scouts = 3 here (default 8); five questions</text><text x="110" y="96" font-size="13" font-weight="600" text-anchor="middle" class="">map(scouts)</text><text x="110" y="112" font-size="10" font-weight="400" text-anchor="middle" class="muted">plan order</text><text x="430" y="96" font-size="13" font-weight="600" text-anchor="middle" class="">Semaphore: 3 slots</text><text x="430" y="112" font-size="10" font-weight="400" text-anchor="middle" class="muted">each slot runs one scout</text><text x="770" y="96" font-size="13" font-weight="600" text-anchor="middle" class="">Join</text><text x="770" y="112" font-size="10" font-weight="400" text-anchor="middle" class="muted">collects typed results</text><text x="950" y="96" font-size="13" font-weight="600" text-anchor="middle" class="">EvidenceLedger</text><text x="950" y="112" font-size="10" font-weight="400" text-anchor="middle" class="muted">record step</text><rect class="panel" x="258" y="126" width="344" height="236" rx="12"/><rect class="panel" x="712" y="126" width="116" height="236" rx="12"/><rect class="panel" x="892" y="126" width="116" height="236" rx="12"/><path class="edge" d="M 150 244 L 256 244" marker-end="url(#a)"/><path class="edge" d="M 604 244 L 710 244" marker-end="url(#a)"/><path class="edge" d="M 830 244 L 890 244" marker-end="url(#a)"/><rect x="276" y="150" width="308" height="40" rx="8" class="node"/><rect x="276" y="224" width="308" height="40" rx="8" class="node"/><rect x="276" y="298" width="308" height="40" rx="8" class="node"/><rect class="k1" x="336" y="165" width="236" height="10" rx="5" fill="var(--t-scout)" stroke="var(--c-scout)" stroke-width="1" style="transform-box:fill-box;transform-origin:left center"/><g class="k2"><rect width="72" height="24" rx="6" fill="var(--t-scout)" stroke="var(--c-scout)" stroke-width="1.4"/><text x="36" y="16" font-size="11.5" font-weight="600" text-anchor="middle" class="mono">q1</text></g><rect class="k3" x="336" y="239" width="236" height="10" rx="5" fill="var(--t-scout)" stroke="var(--c-scout)" stroke-width="1" style="transform-box:fill-box;transform-origin:left center"/><g class="k4"><rect width="72" height="24" rx="6" fill="var(--t-scout)" stroke="var(--c-scout)" stroke-width="1.4"/><text x="36" y="16" font-size="11.5" font-weight="600" text-anchor="middle" class="mono">q2</text></g><rect class="k5" x="336" y="313" width="236" height="10" rx="5" fill="var(--t-scout)" stroke="var(--c-scout)" stroke-width="1" style="transform-box:fill-box;transform-origin:left center"/><g class="k6"><rect width="72" height="24" rx="6" fill="var(--t-scout)" stroke="var(--c-scout)" stroke-width="1.4"/><text x="36" y="16" font-size="11.5" font-weight="600" text-anchor="middle" class="mono">q3</text></g><rect class="k7" x="336" y="239" width="236" height="10" rx="5" fill="var(--t-scout)" stroke="var(--c-scout)" stroke-width="1" style="transform-box:fill-box;transform-origin:left center"/><g class="k8"><rect width="72" height="24" rx="6" fill="var(--t-scout)" stroke="var(--c-scout)" stroke-width="1.4"/><text x="36" y="16" font-size="11.5" font-weight="600" text-anchor="middle" class="mono">q4</text></g><rect class="k9" x="336" y="313" width="236" height="10" rx="5" fill="var(--t-scout)" stroke="var(--c-scout)" stroke-width="1" style="transform-box:fill-box;transform-origin:left center"/><g class="k10"><rect width="72" height="24" rx="6" fill="var(--t-scout)" stroke="var(--c-scout)" stroke-width="1.4"/><text x="36" y="16" font-size="11.5" font-weight="600" text-anchor="middle" class="mono">q5</text></g><g class="k11"><text x="530" y="396" font-size="13" font-weight="400" text-anchor="middle" class="">Three scouts start; q4 and q5 wait for a free slot.</text></g><g class="k12"><text x="530" y="396" font-size="13" font-weight="400" text-anchor="middle" class="">Providers answer at different speeds, so results finish as q2, q3, q1, q5, q4.</text></g><g class="k13"><text x="530" y="396" font-size="13" font-weight="400" text-anchor="middle" class="">The join holds them in completion order. No branch wrote to shared state.</text></g><g class="k14"><text x="530" y="396" font-size="13" font-weight="400" text-anchor="middle" class="">The serial record step sorts by plan position and appends: the ledger is always q1…q5.</text></g></svg>