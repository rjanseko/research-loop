inst the evidence it cites</text><rect class="node k1" x="55.0" y="130.0" width="230" height="60" rx="9"/><text x="170" y="157" font-size="13.5" font-weight="600" text-anchor="middle" class="">Tool result</text><text x="170" y="174" font-size="10.5" font-weight="400" text-anchor="middle" class="mono muted">scholar_fetch</text><rect class="node k2" x="415.0" y="130.0" width="230" height="60" rx="9"/><text x="530" y="157" font-size="13.5" font-weight="600" text-anchor="middle" class="">Evidence</text><text x="530" y="174" font-size="10.5" font-weight="400" text-anchor="middle" class="mono muted">SourceRef + quote</text><rect class="node k3" x="775.0" y="130.0" width="230" height="60" rx="9"/><text x="890" y="157" font-size="13.5" font-weight="600" text-anchor="middle" class="">Quote and source check</text><text x="890" y="174" font-size="10.5" font-weight="400" text-anchor="middle" class="mono muted">quotes.py</text><rect class="node k4" x="55.0" y="330.0" width="230" height="60" rx="9"/><text x="170" y="357" font-size="13.5" font-weight="600" text-anchor="middle" class="">Evidence ledger</text><text x="170" y="374" font-size="10.5" font-weight="400" text-anchor="middle" class="mono muted">claim q1/c1</text><rect class="node k5" x="415.0" y="330.0" width="230" height="60" rx="9"/><text x="530" y="357" font-size="13.5" font-weight="600" text-anchor="middle" class="">Report claim</text><text x="530" y="374" font-size="10.5" font-weight="400" text-anchor="middle" class="mono muted">claim_ids=[q1/c1]</text><rect class="node k6" x="775.0" y="330.0" width="230" height="60" rx="9"/><text x="890" y="357" font-size="13.5" font-weight="600" text-anchor="middle" class="">Verifier</text><text x="890" y="374" font-size="10.5" font-weight="400" text-anchor="middle" class="mono muted">ClaimCheck</text><text x="170" y="210" font-size="11" font-weight="400" text-anchor="middle" class="muted">“…the method cut error rates</text><text x="170" y="225" font-size="11" font-weight="400" text-anchor="middle" class="muted">by half on both benchmarks…”</text><g class="k7"><rect x="415" y="200" width="160" height="18" rx="4" fill="var(--t-data)" stroke="var(--c-data)" stroke-width="1.2"/><text x="495.0" y="213" font-size="11" font-weight="400" text-anchor="middle" class="">“cut error rates by half”</text></g><g class="k8"><rect x="415" y="226" width="160" height="18" rx="4" fill="var(--t-data)" stroke="var(--c-data)" stroke-width="1.2"/><text x="495.0" y="239" font-size="11" font-weight="400" text-anchor="middle" class="">“eliminated all errors”</text></g><g class="k9"><rect x="581" y="200" width="70" height="18" rx="4" fill="var(--t-verify)" stroke="var(--c-verify)" stroke-width="1.2"/><text x="616.0" y="213" font-size="10" font-weight="400" text-anchor="middle" class="mono">verified</text></g><g class="k10"><rect x="581" y="226" width="70" height="18" rx="4" fill="var(--t-block)" stroke="var(--c-block)" stroke-width="1.2"/><text x="616.0" y="239" font-size="10" font-weight="400" text-anchor="middle" class="mono">not_found</text></g><g class="k11"><rect x="850" y="396" width="80" height="18" rx="4" fill="var(--t-verify)" stroke="var(--c-verify)" stroke-width="1.2"/><text x="890.0" y="409" font-size="10" font-weight="400" text-anchor="middle" class="mono">supported</text></g><g class="k12" style="offset-path:path('M 285.0 160 C 350.0 160, 350.0 160, 415.0 160');offset-rotate:0deg"><circle r="12.35" fill="var(--c-scout)" opacity="0.22"/><circle r="6.5" fill="var(--c-scout)"/></g><g class="k13" style="offset-path:path('M 645.0 160 C 710.0 160, 710.0 160, 775.0 160');offset-rotate:0deg"><circle r="12.35" fill="var(--c-data)" opacity="0.22"/><circle r="6.5" fill="var(--c-data)"/></g><g class="k14" style="offset-path:path('M 890 130 C 890 104, 170 104, 170 130');offset-rotate:0deg"><circle r="12.35" fill="var(--c-verify)" opacity="0.22"/><circle r="6.5" fill="var(--c-verify)"/></g><g class="k15" style="offset-path:path('M 890 190 L 890 280 L 170 280 L 170 330');offset-rotate:0deg"><circle r="12.35" fill="var(--c-verify)" opacity="0.22"/><circle r="6.5" fill="var(--c-verify)"/></g><g class="k16" style="offset-path:path('M 285.0 360 C 350.0 360, 350.0 360, 415.0 360');offset-rotate:0deg"><circle r="12.35" fill="var(--c-join)" opacity="0.22"/><circle r="6.5" fill="var(--c-join)"/></g><g class="k17" style="offset-path:path('M 645.0 360 C 710.0 360, 710.0 360, 775.0 360');offset-rotate:0deg"><circle r="12.35" fill="var(--c-synth)" opacity="0.22"/><circle r="6.5" fill="var(--c-synth)"/></g><g class="k18" style="offset-path:path('M 890 390 C 890 416, 170 416, 170 390');offset-rotate:0deg"><circle r="12.35" fill="var(--c-verify)" opacity="0.22"/><circle r="6.5" fill="var(--c-verify)"/></g><g class="k19"><text x="550.0" y="464" font-size="14" font-weight="400" text-anchor="middle" class="">A scout reads a source and records what it says, with quotes.</text></g><g class="k20"><text x="550.0" y="464" font-size="14" font-weight="400" text-anchor="middle" class="">Code looks for each quote in what the tools actually returned.</text></g><g class="k21"><text x="550.0" y="464" font-size="14" font-weight="400" text-anchor="middle" class="">The evidence goes into the ledger under a claim ID.</text></g><g class="k22"><text x="550.0" y="464" font-size="14" font-weight="400" text-anchor="middle" class="">A report claim can only cite claim IDs that are in the ledger.</text></g><g class="k23"><text x="550.0" y="464" font-size="14" font-weight="400" text-anchor="middle" class="">The verifier checks each report claim against the evidence it cites.</text></g></svg>