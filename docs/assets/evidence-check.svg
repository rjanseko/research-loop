<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="t d"><title id="t">How a claim is checked</title><desc id="d">A scout records two quotes from a source it read. Code looks for each quote in the tool output that call received: one is verified and one is not found. The evidence enters the ledger as claim q1/c1, the report cites q1/c1, and the verifier checks the report claim against that evidence.</desc><style>:root{--bg:#ffffff;--fg:#0f172a;--muted:#475569;--node:#f1f5f9;--edge:#94a3b8;--frame:#cbd5e1;--c-planner:#4f46e5;--t-planner:#e0e7ff;--c-scout:#0d9488;--t-scout:#ccfbf1;--c-join:#475569;--t-join:#e2e8f0;--c-gap:#7c3aed;--t-gap:#ede9fe;--c-deep:#0284c7;--t-deep:#e0f2fe;--c-synth:#db2777;--t-synth:#fce7f3;--c-verify:#059669;--t-verify:#d1fae5;--c-done:#ca8a04;--t-done:#fef3c7;--c-block:#dc2626;--t-block:#fee2e2;--c-data:#9333ea;--t-data:#f3e8ff}@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--fg:#e6edf3;--muted:#9da7b3;--node:#1c2129;--edge:#6e7681;--frame:#3d444d;--c-planner:#818cf8;--t-planner:#312e81;--c-scout:#2dd4bf;--t-scout:#134e4a;--c-join:#94a3b8;--t-join:#334155;--c-gap:#a78bfa;--t-gap:#4c1d95;--c-deep:#38bdf8;--t-deep:#0c4a6e;--c-synth:#f472b6;--t-synth:#831843;--c-verify:#34d399;--t-verify:#064e3b;--c-done:#facc15;--t-done:#713f12;--c-block:#f87171;--t-block:#7f1d1d;--c-data:#c084fc;--t-data:#581c87}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.muted{fill:var(--muted)}.edge{fill:none;stroke:var(--edge);stroke-width:2}.dash{stroke-dasharray:5 4}.arrow{fill:var(--edge)}.node{fill:var(--node);stroke:var(--edge);stroke-width:1.6}.frame{fill:var(--bg);stroke:var(--frame);stroke-width:1}.panel{fill:none;stroke:var(--edge);stroke-width:1.4;stroke-dasharray:5 4}@keyframes k1{0.000%{fil