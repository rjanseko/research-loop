name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A disposable database for the Postgres tests in tests/test_store.py; the rest of the suite stays offline.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: research
          POSTGRES_PASSWORD: research
          POSTGRES_DB: research_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U research -d research_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RESEARCH_TEST_DATABASE_URL: postgresql://research:research@127.0.0.1:5432/research_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      # Pinned dependencies from the lockfile, then the project itself.
      - name: Install
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
      - name: Lockfile matches pyproject.toml
        run: |
          pip install -q uv==0.8.17
          uv pip compile pyproject.toml --extra all --universal --python-version 3.12 -q -o requirements.lock
          git diff --exit-code requirements.lock || (echo "requirements.lock is stale; run make lock" && exit 1)
      - name: Lint
        run: ruff check .
      # Offline by design: tests/conftest.py refuses model-provider requests and non-loopback hosts,
      # so no secrets or network access are needed. The Postgres service is on loopback.
      - name: Test
        run: pytest -q
      # The editable install above reads files from the checkout; a wheel carries only what is
      # packaged, so install one into a clean environment and check that it runs.
      - name: Wheel install smoke test
        run: |
          pip wheel --no-deps -w dist .
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install -q "$(ls dist/research_loop-*.whl)[postgres]"
          cd /tmp
          /tmp/wheel-env/bin/python -c "from research_loop.db import migration_files; print([m.name for m in migration_files()])"
          /tmp/wheel-env/bin/research --help > /dev/null
          /tmp/wheel-env/bin/research scout --help > /dev/null
