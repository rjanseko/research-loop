[project]
name = "research-loop-v5"
version = "0.5.0"
description = "Graph-backed, role-routed PydanticAI research loop with evidence provenance, benchmark adapters, and Postgres telemetry"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "pydantic-ai[duckduckgo,web-fetch]>=2.47,<3",
  "pydantic-graph>=2.47,<3",
]

[project.optional-dependencies]
eval = ["pydantic-evals>=1.0"]
postgres = ["psycopg[binary,pool]>=3.2"]
test = ["pytest>=8", "pytest-asyncio>=0.24"]
benchmark = ["pandas>=2.2", "pyarrow>=16"]
attachments = [
  "pypdf>=5",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "beautifulsoup4>=4.12",
  "Pillow>=10",
]
all = [
  "pydantic-evals>=1.0",
  "psycopg[binary,pool]>=3.2",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pandas>=2.2",
  "pyarrow>=16",
  "pypdf>=5",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "beautifulsoup4>=4.12",
  "Pillow>=10",
]

[project.scripts]
research-bench = "research_loop.benchmark:main"
research-graph = "research_loop.graph_cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
