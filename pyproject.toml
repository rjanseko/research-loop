[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "research-loop"
version = "0.5.0"
description = "Cited answers to research questions, with every claim traced to the passage behind it"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.10",
  "pydantic-ai[duckduckgo]>=2.47,<3",
  "logfire>=5,<6",
  # Page and PDF extraction for the research tools. fontTools lets pypdf read embedded CFF fonts
  # instead of logging each one.
  "httpx>=0.27",
  "httpcore>=1",
  "trafilatura>=2,<3",
  "beautifulsoup4>=4.12",
  "pypdf>=5",
  "fonttools>=4",
]

[project.optional-dependencies]
eval = ["pydantic-evals>=2.47,<3"]
postgres = ["psycopg[binary,pool]>=3.2"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "reportlab>=4", "ruff>=0.16,<0.17"]
all = ["research-loop[eval,postgres,test]"]

[tool.setuptools.package-data]
research_loop = ["migrations/*.sql", "prices.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Logfire's pytest plugin would trace the test run whenever LOGFIRE_TOKEN is set.
addopts = "--no-logfire"
pythonpath = ["src"]
markers = ["postgres: integration tests against a disposable Postgres; set RESEARCH_TEST_DATABASE_URL to run them"]

[tool.ruff.lint]
# ruff 0.16's default rules, pinned with ruff itself in the `test` extra: upgrading ruff is a
# deliberate change. Deliberate blind excepts carry `# noqa: BLE001` with the reason.

